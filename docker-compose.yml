# ===========================================================================
# DeNDDron Swarm Docker Compose Configuration (Optimized 2026)
# ===========================================================================

services:
  # ===========================================================================
  # DeNDDron Base (Shared Dependency)
  # ===========================================================================
  denddron-base:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: denddron-base:latest

  # ===========================================================================
  # Zenoh Router
  # ===========================================================================
  zenoh_router:
    image: eclipse/zenoh:latest
    container_name: zenoh_router
    ports:
      - "7447:7447/tcp"
      - "7447:7447/udp"
    environment:
      RUST_LOG: info
    networks:
      - swarm_network
    restart: unless-stopped
    command: >
      --listen tcp/0.0.0.0:7447
      --listen udp/0.0.0.0:7447

  # ===========================================================================
  # Gazebo Simulator
  # ===========================================================================
  gazebo_simulator:
    build:
      context: .
      dockerfile: docker/gazebo.Dockerfile
    container_name: gazebo_simulator
    environment:
      ZENOH_ROUTER_IP: tcp/zenoh_router:7447
      GAZEBO_RESOURCE_PATH: /usr/share/gazebo-11:/home/app/sim
      SWARM_RUNTIME_CONFIG: /home/app/config/swarm_runtime.json
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config:/home/app/config:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - swarm_network
    depends_on:
      - zenoh_router
      - denddron-base
    healthcheck:
      test: ["CMD-SHELL", "grep -a gazebo_simulator /proc/[0-9]*/cmdline >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "11345:11345"

  # ===========================================================================
  # Agent Service (Scale with: docker compose up --scale agent=<N>)
  # ===========================================================================
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      ZENOH_ROUTER_IP: tcp/zenoh_router:7447
      SWARM_RUNTIME_CONFIG: /app/config/swarm_runtime.json
      AGENT_ID_REGISTRY: /app/config/agent_registry.json
      LOOP_RATE_HZ: "50"
    command: >
      sh -c 'python -u main.py --zenoh-router "$${ZENOH_ROUTER_IP}"'
    networks:
      - swarm_network
    depends_on:
      zenoh_router:
        condition: service_started
      gazebo_simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - swarm_state:/state
      - ./config:/app/config
    logging: &agent_logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Metrics Node
  # ===========================================================================
  metrics_node:
    build:
      context: .
      dockerfile: docker/metrics.Dockerfile
    container_name: metrics_node
    environment:
      ZENOH_ROUTER_IP: tcp/zenoh_router:7447
    networks:
      - swarm_network
    depends_on:
      zenoh_router:
        condition: service_started
      gazebo_simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *agent_logging
    volumes:
      - swarm_state:/state
      - /tmp:/tmp

# ===========================================================================
# Network Configuration
# ===========================================================================
networks:
  swarm_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  swarm_state: