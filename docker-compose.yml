# ===========================================================================
# DeNDDron Swarm
#
# Several instances can run side by side (scripts/run_swarm.sh --instance K):
# names, ports, subnets and the config directory come from the instance's env
# file (scripts/swarm_instance.py). The defaults below are instance 0.
#
# Two networks:
#   sim_net   - the simulator's Zenoh router ("sim bus"): each drone's own
#               sensors/actuators, sim clock, detonations, threat tracks for
#               Gazebo. Stands in for onboard wiring, not communications.
#   radio_net - peer-to-peer Zenoh (no router) between drones and the ship.
#               Degrade this network to study degraded communications.
# ===========================================================================

services:
  denddron_base:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: denddron_base:latest

  # Simulator bus (onboard links only)
  # Fixed address: everything connects by IP. With ~50 containers starting, Docker's embedded DNS
  # failed lookups of "sim_bus" intermittently, and every failed lookup was a crashed drone.
  sim_bus:
    image: eclipse/zenoh:latest
    container_name: ${NAME_PREFIX:-}sim_bus
    environment:
      RUST_LOG: info
    networks:
      sim_net:
        ipv4_address: ${SIM_BUS_IP:-172.20.0.2}
    restart: unless-stopped
    command: >
      --listen tcp/0.0.0.0:7447
      --no-multicast-scouting

  gazebo_simulator:
    build:
      context: .
      dockerfile: docker/gazebo.Dockerfile
    image: denddron-swarm-gazebo_simulator   # fixed name: shared by every instance
    container_name: ${NAME_PREFIX:-}gazebo_simulator
    environment:
      ZENOH_ROUTER_IP: tcp/${SIM_BUS_IP:-172.20.0.2}:7447
      SIM_RTF: ${SIM_RTF:-1}
      GAZEBO_RESOURCE_PATH: /usr/share/gazebo-11:/home/app/sim
      SWARM_RUNTIME_CONFIG: /home/app/config/swarm_runtime.json
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: 1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${SWARM_CONFIG_DIR:-./config}:/home/app/config:ro
    devices:
      - /dev/dri:/dev/dri
    networks:
      - sim_net
    depends_on:
      - sim_bus
      - denddron_base
    healthcheck:
      test: ["CMD-SHELL", "grep -a gazebo_simulator /proc/[0-9]*/cmdline >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "${GAZEBO_PORT:-11345}:11345"

  # Drones (scale with: docker compose up --scale agent=<N>)
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: denddron-swarm-agent   # fixed name: shared by every instance
    environment:
      SIM_BUS: tcp/${SIM_BUS_IP:-172.20.0.2}:7447
      RADIO_SUBNET: ${RADIO_SUBNET:-172.21.0.0/16}
      RADIO_CONNECT: udp/${RADIO_SHIP_IP:-172.21.0.2}:7450
      RADIO_QOS: ${RADIO_QOS:-default}
      SIM_RTF: ${SIM_RTF:-1}
      ZONE_KEEPOUT: ${ZONE_KEEPOUT:-1}
      # Distributed clock (src/common/localclock.py, timesync.py); all 0/none = perfect shared clock
      CLOCK_DRIFT_PPM: ${CLOCK_DRIFT_PPM:-0}
      CLOCK_DRIFT_SPREAD_PPM: ${CLOCK_DRIFT_SPREAD_PPM:-0}
      CLOCK_OFFSET_S: ${CLOCK_OFFSET_S:-0}
      CLOCK_OFFSET_SPREAD_S: ${CLOCK_OFFSET_SPREAD_S:-0}
      CLOCK_JITTER_S: ${CLOCK_JITTER_S:-0}
      CLOCK_SEED: ${CLOCK_SEED:-0}
      CLOCK_SYNC: ${CLOCK_SYNC:-none}
      CLOCK_BEACON_HZ: ${CLOCK_BEACON_HZ:-0.5}
      CLOCK_GAIN: ${CLOCK_GAIN:-0.5}
      CLOCK_LEADER_SHARE: ${CLOCK_LEADER_SHARE:-0.5}
      CLOCK_AGGREGATE: ${CLOCK_AGGREGATE:-mean}
      CLOCK_STEP_S: ${CLOCK_STEP_S:-0.05}
      SWARM_RUNTIME_CONFIG: /app/config/swarm_runtime.json
      AGENT_ID_REGISTRY: /app/config/agent_registry.json
    # exec so SIGTERM reaches python and the agent shuts down cleanly
    command: >
      sh -c 'exec python -u main.py --sim-bus "$${SIM_BUS}"'
    networks:
      - sim_net
      - radio_net
    depends_on:
      sim_bus:
        condition: service_started
      gazebo_simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ${SWARM_CONFIG_DIR:-./config}:/app/config
    logging: &agent_logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ship: radar picture, operator dashboard (http://localhost:8080), roster, kill assessment
  ship:
    build:
      context: .
      dockerfile: docker/ship.Dockerfile
    image: denddron-swarm-ship   # fixed name: shared by every instance
    container_name: ${NAME_PREFIX:-}ship
    environment:
      SIM_BUS: tcp/${SIM_BUS_IP:-172.20.0.2}:7447
      RADIO_SUBNET: ${RADIO_SUBNET:-172.21.0.0/16}
      RADIO_LISTEN_PORT: 7450
      RADIO_QOS: ${RADIO_QOS:-default}
      SIM_RTF: ${SIM_RTF:-1}
      SWARM_RUNTIME_CONFIG: /app/config/swarm_runtime.json
      MAX_THREATS: ${MAX_THREATS:-0}
      THREAT_INTERVAL_S: ${THREAT_INTERVAL_S:-30}
      THREAT_FIRST_S: ${THREAT_FIRST_S:-20}
      THREAT_SEED: ${THREAT_SEED:-42}
      THREAT_TYPES: ${THREAT_TYPES:-}
      THREAT_MANEUVER_P: ${THREAT_MANEUVER_P:-0}
      INTERCEPT_MAX_RANGE_M: ${INTERCEPT_MAX_RANGE_M:-140}
      SHIP_CLOCK_DRIFT_PPM: ${SHIP_CLOCK_DRIFT_PPM:-0}
      SHIP_CLOCK_OFFSET_S: ${SHIP_CLOCK_OFFSET_S:-0}
      SHIP_CLOCK_JITTER_S: ${SHIP_CLOCK_JITTER_S:-0}
      CLOCK_SEED: ${CLOCK_SEED:-0}
      CLOCK_SYNC: ${CLOCK_SYNC:-none}
    command: >
      sh -c 'exec python -u ship.py --sim-bus "$${SIM_BUS}"'
    networks:
      sim_net:
      radio_net:
        ipv4_address: ${RADIO_SHIP_IP:-172.21.0.2}
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      sim_bus:
        condition: service_started
      gazebo_simulator:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ${SWARM_CONFIG_DIR:-./config}:/app/config:ro
      - swarm_state:/state
    logging: *agent_logging

  metrics_node:
    build:
      context: .
      dockerfile: docker/metrics.Dockerfile
    image: denddron-swarm-metrics_node   # fixed name: shared by every instance
    container_name: ${NAME_PREFIX:-}metrics_node
    environment:
      ZENOH_ROUTER_IP: tcp/${SIM_BUS_IP:-172.20.0.2}:7447
    command: ["python", "-u", "src/metrics/main.py"]
    networks:
      - sim_net
    depends_on:
      sim_bus:
        condition: service_started
      gazebo_simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *agent_logging
    volumes:
      - swarm_state:/state

networks:
  sim_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${SIM_SUBNET:-172.20.0.0/16}
          ip_range: ${SIM_IP_RANGE:-172.20.128.0/17}   # automatic addresses; fixed ones stay below
  radio_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${RADIO_SUBNET:-172.21.0.0/16}
          ip_range: ${RADIO_IP_RANGE:-172.21.128.0/17}

volumes:
  swarm_state:
