<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" class="dg" viewBox="0 0 1040 310" role="img" aria-label="Launch pipeline: run_swarm.sh calls generate_swarm_config.py, which merges the hardware record into swarm_runtime.json; docker compose starts the services from prebuilt images; sweeps call the launcher once per run and collect results.">
<style>
:root{--surface:#FFFFFF;--group:#E6ECEF;--ink:#14212B;--ink-2:#3B4B58;--muted:#5D6D79;--line:#C6D0D6;
--accent:#0A6A8A;--accent-soft:rgba(10,106,138,0.09);--hot:#B3431B;--hot-soft:rgba(179,67,27,0.10);--f-sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--surface:#15202A;--group:#18242E;--ink:#E2E9EE;--ink-2:#A7B6C1;--muted:#8696A2;--line:#2C3B47;
--accent:#52B5D5;--accent-soft:rgba(82,181,213,0.13);--hot:#EE8A5E;--hot-soft:rgba(238,138,94,0.14);}}
svg.dg{font-family:var(--f-sans)}
.dg .bg{fill:var(--surface)}

.dg text { fill: var(--ink); font-size: 12px; }
.dg .h { font-weight: 600; font-size: 12.5px; }
.dg .s { fill: var(--muted); font-size: 10.5px; }
.dg .m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dg .mi { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); }
.dg .lbl { font-size: 10.5px; fill: var(--ink-2); }
.dg .lbl-r { fill: var(--accent); }
.dg .lbl-h { fill: var(--hot); }
.dg .band-t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.05em; fill: var(--muted); }
.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dg .bx { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .bx-r { stroke: var(--accent); stroke-width: 1.5; }
.dg .bx-h { stroke: var(--hot); stroke-width: 1.5; }
.dg .bx-fill-r { fill: var(--accent-soft); }
.dg .bx-fill-h { fill: var(--hot-soft); }
.dg .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ctr { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .band-r { fill: var(--accent-soft); stroke: none; }
.dg .note { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ln { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.dg .ln-thin { stroke-width: 1; opacity: 0.75; }
.dg .ln-r { stroke: var(--accent); stroke-dasharray: 6 4; }
.dg .ln-rs { stroke: var(--accent); }
.dg .ln-h { stroke: var(--hot); }
.dg .ln-d { stroke-dasharray: 2 3; }
.dg .ln-dash { stroke-dasharray: 5 4; }
.dg .ln-bold { stroke-width: 2.2; }
.dg .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .mk { fill: var(--ink-2); }
.dg .mk-r { fill: var(--accent); }
.dg .mk-h { fill: var(--hot); }
.dg .dot-r { fill: var(--accent); }
.dg .dot-h { fill: var(--hot); }
.dg .dot-i { fill: var(--ink); }
.dg .zone { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .ring { fill: none; stroke: var(--accent-soft); }
.dg .faint { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.dg .hull { fill: var(--ink-2); }

</style>
<rect class="bg" x="0" y="0" width="1040" height="310" rx="8"/>
        <defs>
          <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <rect class="bx bx-r" x="20" y="40" width="170" height="72" rx="6"/>
        <text class="h" x="32" y="62">run_swarm.sh</text>
        <text class="s" x="32" y="82">N, --threats, --rtf,</text>
        <text class="s" x="32" y="100">--localization, --no-fly …</text>

        <rect class="bx" x="230" y="40" width="200" height="72" rx="6"/>
        <text class="h" x="242" y="62">generate_swarm_config.py</text>
        <text class="s" x="242" y="82">stations at R+5 … R+45 m</text>
        <text class="s" x="242" y="100">planner + kinematics defaults</text>

        <rect class="bx" x="470" y="40" width="170" height="72" rx="6"/>
        <text class="h" x="482" y="62">swarm_runtime.json</text>
        <text class="s" x="482" y="82">+ .swarm.env</text>
        <text class="s" x="482" y="100">read by sim, ship, drones</text>

        <rect class="bx" x="680" y="40" width="170" height="72" rx="6"/>
        <text class="h" x="692" y="62">docker compose up</text>
        <text class="m" x="692" y="82">--scale agent=N</text>
        <text class="s" x="692" y="100">2 networks · healthchecks</text>

        <rect class="bx" x="890" y="40" width="140" height="100" rx="6"/>
        <text class="h" x="902" y="62">running swarm</text>
        <text class="s" x="902" y="82">sim_bus</text>
        <text class="s" x="902" y="98">gazebo_simulator</text>
        <text class="s" x="902" y="114">ship · metrics_node</text>
        <text class="s" x="902" y="130">agent × N</text>

        <line class="ln" x1="190" y1="76" x2="228" y2="76" marker-end="url(#f2a)"/>
        <text class="lbl" x="209" y="68" text-anchor="middle">calls</text>
        <line class="ln" x1="430" y1="76" x2="468" y2="76" marker-end="url(#f2a)"/>
        <text class="lbl" x="449" y="68" text-anchor="middle">writes</text>
        <line class="ln" x1="640" y1="76" x2="678" y2="76" marker-end="url(#f2a)"/>
        <text class="lbl" x="659" y="68" text-anchor="middle">env</text>
        <line class="ln" x1="850" y1="76" x2="888" y2="76" marker-end="url(#f2a)"/>
        <text class="lbl" x="869" y="68" text-anchor="middle">starts</text>

        <rect class="bx" x="20" y="180" width="170" height="72" rx="6"/>
        <text class="h" x="32" y="202">sweeps</text>
        <text class="m" x="32" y="222">tools/comms/*_sweep.py</text>
        <text class="m" x="32" y="240">experiments/*.sh</text>
        <line class="ln" x1="105" y1="180" x2="105" y2="114" marker-end="url(#f2a)"/>
        <text class="lbl" x="113" y="152">one launch per run</text>

        <rect class="bx" x="230" y="180" width="200" height="72" rx="6"/>
        <text class="h" x="242" y="202">hardware/hardware.json</text>
        <text class="s" x="242" y="222">UWB, radar, IMU, GNSS,</text>
        <text class="s" x="242" y="240">airframe and warhead classes</text>
        <line class="ln" x1="330" y1="180" x2="330" y2="114" marker-end="url(#f2a)"/>
        <text class="lbl" x="338" y="152">copied under "hardware"</text>

        <rect class="bx" x="680" y="180" width="170" height="72" rx="6"/>
        <text class="h" x="692" y="202">images</text>
        <text class="s" x="692" y="222">base: zenoh-c/cpp 1.0.4</text>
        <text class="s" x="692" y="240">python 3.10 + zenoh 1.10.1</text>
        <line class="ln" x1="765" y1="180" x2="765" y2="114" marker-end="url(#f2a)"/>
        <text class="lbl" x="773" y="152">--build</text>

        <rect class="bx" x="890" y="180" width="140" height="72" rx="6"/>
        <text class="h" x="902" y="202">results/</text>
        <text class="s" x="902" y="222">summary.json · logs</text>
        <text class="s" x="902" y="240">ship_log.jsonl</text>
        <line class="ln" x1="960" y1="140" x2="960" y2="178" marker-end="url(#f2a)"/>

        <polyline class="ln ln-d" points="960,252 960,290 105,290 105,254" marker-end="url(#f2a)"/>
        <text class="lbl" x="530" y="283" text-anchor="middle">sweep reads /api/summary and the logs, then tears the swarm down</text>
      </svg>
