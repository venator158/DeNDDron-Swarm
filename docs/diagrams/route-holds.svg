<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="352" class="dg" viewBox="0 0 1040 352" role="img" aria-label="Distance along the route against time: another job's blast occupies 25 to 49 m during 12 to 16 s. The straight trapezoidal flight would be inside it; the planned route stops at 22 m, holds until 16 s, then continues and arrives at 29.5 s, before its own detonation time at 31 s.">
<style>
:root{--surface:#FFFFFF;--group:#E6ECEF;--ink:#14212B;--ink-2:#3B4B58;--muted:#5D6D79;--line:#C6D0D6;
--accent:#0A6A8A;--accent-soft:rgba(10,106,138,0.09);--hot:#B3431B;--hot-soft:rgba(179,67,27,0.10);--f-sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--surface:#15202A;--group:#18242E;--ink:#E2E9EE;--ink-2:#A7B6C1;--muted:#8696A2;--line:#2C3B47;
--accent:#52B5D5;--accent-soft:rgba(82,181,213,0.13);--hot:#EE8A5E;--hot-soft:rgba(238,138,94,0.14);}}
svg.dg{font-family:var(--f-sans)}
.dg .bg{fill:var(--surface)}

.dg text { fill: var(--ink); font-size: 12px; }
.dg .h { font-weight: 600; font-size: 12.5px; }
.dg .s { fill: var(--muted); font-size: 10.5px; }
.dg .m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dg .mi { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); }
.dg .lbl { font-size: 10.5px; fill: var(--ink-2); }
.dg .lbl-r { fill: var(--accent); }
.dg .lbl-h { fill: var(--hot); }
.dg .band-t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.05em; fill: var(--muted); }
.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dg .bx { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .bx-r { stroke: var(--accent); stroke-width: 1.5; }
.dg .bx-h { stroke: var(--hot); stroke-width: 1.5; }
.dg .bx-fill-r { fill: var(--accent-soft); }
.dg .bx-fill-h { fill: var(--hot-soft); }
.dg .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ctr { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .band-r { fill: var(--accent-soft); stroke: none; }
.dg .note { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ln { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.dg .ln-thin { stroke-width: 1; opacity: 0.75; }
.dg .ln-r { stroke: var(--accent); stroke-dasharray: 6 4; }
.dg .ln-rs { stroke: var(--accent); }
.dg .ln-h { stroke: var(--hot); }
.dg .ln-d { stroke-dasharray: 2 3; }
.dg .ln-dash { stroke-dasharray: 5 4; }
.dg .ln-bold { stroke-width: 2.2; }
.dg .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .mk { fill: var(--ink-2); }
.dg .mk-r { fill: var(--accent); }
.dg .mk-h { fill: var(--hot); }
.dg .dot-r { fill: var(--accent); }
.dg .dot-h { fill: var(--hot); }
.dg .dot-i { fill: var(--ink); }
.dg .zone { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .ring { fill: none; stroke: var(--accent-soft); }
.dg .faint { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.dg .hull { fill: var(--ink-2); }

</style>
<rect class="bg" x="0" y="0" width="1040" height="352" rx="8"/>
          <defs>
            <marker id="f10r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-r" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
          <!-- grid & axes -->
          <line class="grid" x1="80" y1="213.3" x2="980" y2="213.3"/>
          <line class="grid" x1="80" y1="126.7" x2="980" y2="126.7"/>
          <line class="grid" x1="80" y1="40" x2="980" y2="40"/>
          <line class="ln" x1="80" y1="300" x2="980" y2="300"/>
          <line class="ln" x1="80" y1="300" x2="80" y2="36"/>
          <g class="s" text-anchor="middle">
            <text x="80" y="318">0</text><text x="192.5" y="318">4</text><text x="305" y="318">8</text><text x="417.5" y="318">12</text><text x="530" y="318">16</text><text x="642.5" y="318">20</text><text x="755" y="318">24</text><text x="867.5" y="318">28</text><text x="980" y="318">32</text>
          </g>
          <g class="s" text-anchor="end">
            <text x="72" y="304">0</text><text x="72" y="217">20</text><text x="72" y="131">40</text><text x="72" y="44">60</text>
          </g>
          <text class="lbl" x="530" y="342" text-anchor="middle">time (s)</text>
          <text class="lbl" x="30" y="170" text-anchor="middle" transform="rotate(-90 30 170)">distance along route (m)</text>

          <rect x="417.5" y="87.7" width="112.5" height="104" stroke-width="1.2" stroke-dasharray="5 4" style="fill:var(--hot-soft);stroke:var(--hot)"/>
          <text class="lbl lbl-h" x="474" y="132" text-anchor="middle">other job's</text>
          <text class="lbl lbl-h" x="474" y="146" text-anchor="middle">blast</text>
          <text class="s" x="540" y="140">12 m around its slot,</text>
          <text class="s" x="540" y="154">during t_engage ± 2 s</text>

          <polyline class="ln ln-d" points="80,300 108.1,297.8 136.3,291.3 164.4,280.5 192.5,265.3 501.9,74.7 530,59.5 558.1,48.7 586.3,42.2 614.4,40"/>
          <text class="lbl" x="606" y="31" text-anchor="end">straight flight (dotted) would be inside the blast during its window</text>

          <polyline class="ln ln-rs" style="stroke-width:2.4" points="80,300 108.1,297.8 136.3,291.3 164.4,280.5 192.5,265.3 234.7,239.3 262.8,224.2 290.9,213.3 319.1,206.8 347.2,204.7 530,204.7 558.1,202.5 586.3,196 614.4,185.2 642.5,170 797.2,74.7 825.3,59.5 853.4,48.7 881.6,42.2 909.7,40"/>
          <text class="lbl lbl-r" x="438" y="222" text-anchor="middle">hold at 22 m (3 m short) until the window closes</text>
          <text class="lbl lbl-r" x="652" y="190">planned route</text>
          <circle class="dot-r" cx="909.7" cy="40" r="4.5"/>
          <text class="lbl lbl-r" x="902" y="60" text-anchor="end">arrives 29.5 s</text>
          <line class="ln ln-d" x1="951.9" y1="300" x2="951.9" y2="40"/>
          <text class="lbl" x="958" y="80">own</text>
          <text class="lbl" x="958" y="94">t_engage</text>
        </svg>
