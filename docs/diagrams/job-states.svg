<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="276" class="dg" viewBox="0 0 1040 276" role="img" aria-label="State machine of a drone's job: free, bidding, tentative, confirmed, expended, with the return paths to free when it loses the auction, is refused or yields, or is released.">
<style>
:root{--surface:#FFFFFF;--group:#E6ECEF;--ink:#14212B;--ink-2:#3B4B58;--muted:#5D6D79;--line:#C6D0D6;
--accent:#0A6A8A;--accent-soft:rgba(10,106,138,0.09);--hot:#B3431B;--hot-soft:rgba(179,67,27,0.10);--f-sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--surface:#15202A;--group:#18242E;--ink:#E2E9EE;--ink-2:#A7B6C1;--muted:#8696A2;--line:#2C3B47;
--accent:#52B5D5;--accent-soft:rgba(82,181,213,0.13);--hot:#EE8A5E;--hot-soft:rgba(238,138,94,0.14);}}
svg.dg{font-family:var(--f-sans)}
.dg .bg{fill:var(--surface)}

.dg text { fill: var(--ink); font-size: 12px; }
.dg .h { font-weight: 600; font-size: 12.5px; }
.dg .s { fill: var(--muted); font-size: 10.5px; }
.dg .m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dg .mi { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); }
.dg .lbl { font-size: 10.5px; fill: var(--ink-2); }
.dg .lbl-r { fill: var(--accent); }
.dg .lbl-h { fill: var(--hot); }
.dg .band-t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.05em; fill: var(--muted); }
.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dg .bx { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .bx-r { stroke: var(--accent); stroke-width: 1.5; }
.dg .bx-h { stroke: var(--hot); stroke-width: 1.5; }
.dg .bx-fill-r { fill: var(--accent-soft); }
.dg .bx-fill-h { fill: var(--hot-soft); }
.dg .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ctr { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .band-r { fill: var(--accent-soft); stroke: none; }
.dg .note { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ln { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.dg .ln-thin { stroke-width: 1; opacity: 0.75; }
.dg .ln-r { stroke: var(--accent); stroke-dasharray: 6 4; }
.dg .ln-rs { stroke: var(--accent); }
.dg .ln-h { stroke: var(--hot); }
.dg .ln-d { stroke-dasharray: 2 3; }
.dg .ln-dash { stroke-dasharray: 5 4; }
.dg .ln-bold { stroke-width: 2.2; }
.dg .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .mk { fill: var(--ink-2); }
.dg .mk-r { fill: var(--accent); }
.dg .mk-h { fill: var(--hot); }
.dg .dot-r { fill: var(--accent); }
.dg .dot-h { fill: var(--hot); }
.dg .dot-i { fill: var(--ink); }
.dg .zone { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .ring { fill: none; stroke: var(--accent-soft); }
.dg .faint { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.dg .hull { fill: var(--ink-2); }

</style>
<rect class="bg" x="0" y="0" width="1040" height="276" rx="8"/>
          <defs>
            <marker id="f7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
          <rect class="bx" x="20" y="100" width="130" height="50" rx="8"/>
          <text class="h" x="85" y="121" text-anchor="middle">Free</text><text class="s" x="85" y="138" text-anchor="middle">idle, localized</text>
          <rect class="bx" x="240" y="100" width="130" height="50" rx="8"/>
          <text class="h" x="305" y="121" text-anchor="middle">Bidding</text><text class="s" x="305" y="138" text-anchor="middle">ETA via plan_route</text>
          <rect class="bx bx-r" x="460" y="100" width="130" height="50" rx="8"/>
          <text class="h" x="525" y="121" text-anchor="middle">Tentative</text><text class="s" x="525" y="138" text-anchor="middle">award sent, flying</text>
          <rect class="bx bx-r bx-fill-r" x="680" y="100" width="130" height="50" rx="8"/>
          <text class="h" x="745" y="121" text-anchor="middle">Confirmed</text><text class="s" x="745" y="138" text-anchor="middle">ACK + slot</text>
          <rect class="bx bx-h bx-fill-h" x="900" y="100" width="130" height="50" rx="8"/>
          <text class="h" x="965" y="121" text-anchor="middle">Expended</text><text class="s" x="965" y="138" text-anchor="middle">detonated</text>

          <line class="ln" x1="150" y1="125" x2="238" y2="125" marker-end="url(#f7a)"/>
          <text class="lbl" x="195" y="104" text-anchor="middle">order ×3,</text><text class="lbl" x="195" y="117" text-anchor="middle">can arrive</text>
          <line class="ln" x1="370" y1="125" x2="458" y2="125" marker-end="url(#f7a)"/>
          <text class="lbl" x="415" y="104" text-anchor="middle">after 1 s,</text><text class="lbl" x="415" y="117" text-anchor="middle">won assign()</text>
          <line class="ln" x1="590" y1="125" x2="678" y2="125" marker-end="url(#f7a)"/>
          <text class="lbl" x="635" y="104" text-anchor="middle">ship ACK</text><text class="lbl" x="635" y="117" text-anchor="middle">≤ 0.3 s</text>
          <line class="ln ln-h" x1="810" y1="125" x2="898" y2="125" marker-end="url(#f7a)"/>
          <text class="lbl lbl-h" x="855" y="104" text-anchor="middle">fuze or</text><text class="lbl lbl-h" x="855" y="117" text-anchor="middle">chain fire</text>

          <path class="ln" d="M500 100 C500 64, 550 64, 550 98" marker-end="url(#f7a)"/>
          <text class="lbl" x="525" y="56" text-anchor="middle">award ×3 · fly to slot · ask again in each heartbeat</text>
          <path class="ln" d="M720 100 C720 48, 770 48, 770 98" marker-end="url(#f7a)"/>
          <text class="lbl" x="745" y="34" text-anchor="middle">job updates 2 Hz · re-aim · re-plan each second</text>

          <path class="ln" d="M305 150 V200 H125 V152" marker-end="url(#f7a)"/>
          <text class="lbl" x="215" y="194" text-anchor="middle">lost or declined</text>
          <path class="ln" d="M525 150 V230 H85 V152" marker-end="url(#f7a)"/>
          <text class="lbl" x="380" y="224" text-anchor="middle">NACK · yields to a better award · too late to arrive</text>
          <path class="ln" d="M745 150 V260 H45 V152" marker-end="url(#f7a)"/>
          <text class="lbl" x="420" y="254" text-anchor="middle">released · job closed · no detection (hold) · missed slot</text>
        </svg>
