<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="270" class="dg" viewBox="0 0 1040 270" role="img" aria-label="Fuze state machine: tracking, mates recorded, armed in a window around t_engage, then fire on a new track in the gate at closest approach or on a mate's blast; if the window closes with no detection the drone holds.">
<style>
:root{--surface:#FFFFFF;--group:#E6ECEF;--ink:#14212B;--ink-2:#3B4B58;--muted:#5D6D79;--line:#C6D0D6;
--accent:#0A6A8A;--accent-soft:rgba(10,106,138,0.09);--hot:#B3431B;--hot-soft:rgba(179,67,27,0.10);--f-sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--surface:#15202A;--group:#18242E;--ink:#E2E9EE;--ink-2:#A7B6C1;--muted:#8696A2;--line:#2C3B47;
--accent:#52B5D5;--accent-soft:rgba(82,181,213,0.13);--hot:#EE8A5E;--hot-soft:rgba(238,138,94,0.14);}}
svg.dg{font-family:var(--f-sans)}
.dg .bg{fill:var(--surface)}

.dg text { fill: var(--ink); font-size: 12px; }
.dg .h { font-weight: 600; font-size: 12.5px; }
.dg .s { fill: var(--muted); font-size: 10.5px; }
.dg .m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dg .mi { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); }
.dg .lbl { font-size: 10.5px; fill: var(--ink-2); }
.dg .lbl-r { fill: var(--accent); }
.dg .lbl-h { fill: var(--hot); }
.dg .band-t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.05em; fill: var(--muted); }
.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dg .bx { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .bx-r { stroke: var(--accent); stroke-width: 1.5; }
.dg .bx-h { stroke: var(--hot); stroke-width: 1.5; }
.dg .bx-fill-r { fill: var(--accent-soft); }
.dg .bx-fill-h { fill: var(--hot-soft); }
.dg .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ctr { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .band-r { fill: var(--accent-soft); stroke: none; }
.dg .note { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ln { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.dg .ln-thin { stroke-width: 1; opacity: 0.75; }
.dg .ln-r { stroke: var(--accent); stroke-dasharray: 6 4; }
.dg .ln-rs { stroke: var(--accent); }
.dg .ln-h { stroke: var(--hot); }
.dg .ln-d { stroke-dasharray: 2 3; }
.dg .ln-dash { stroke-dasharray: 5 4; }
.dg .ln-bold { stroke-width: 2.2; }
.dg .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .mk { fill: var(--ink-2); }
.dg .mk-r { fill: var(--accent); }
.dg .mk-h { fill: var(--hot); }
.dg .dot-r { fill: var(--accent); }
.dg .dot-h { fill: var(--hot); }
.dg .dot-i { fill: var(--ink); }
.dg .zone { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .ring { fill: none; stroke: var(--accent-soft); }
.dg .faint { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.dg .hull { fill: var(--ink-2); }

</style>
<rect class="bg" x="0" y="0" width="1040" height="270" rx="8"/>
          <defs>
            <marker id="f11a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="f11h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-h" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
          <text class="lbl" x="645" y="40" text-anchor="middle">gate: |track − predicted threat| ≤ 5 m + 3σ_own</text>
          <rect class="bx" x="20" y="80" width="150" height="50" rx="8"/>
          <text class="h" x="95" y="101" text-anchor="middle">Tracking</text><text class="s" x="95" y="118" text-anchor="middle">contacts → tracks (NN)</text>
          <rect class="bx" x="230" y="80" width="150" height="50" rx="8"/>
          <text class="h" x="305" y="101" text-anchor="middle">Mates recorded</text><text class="s" x="305" y="118" text-anchor="middle">tracks in range = known</text>
          <rect class="bx bx-r bx-fill-r" x="440" y="80" width="150" height="50" rx="8"/>
          <text class="h" x="515" y="101" text-anchor="middle">Armed</text><text class="s" x="515" y="118" text-anchor="middle">t_engage ± 2 s, ship time</text>
          <rect class="bx bx-h bx-fill-h" x="700" y="80" width="150" height="50" rx="8"/>
          <text class="h" x="775" y="101" text-anchor="middle">Fire</text><text class="s" x="775" y="118" text-anchor="middle">reason: fuze or chain</text>
          <rect class="bx bx-h" x="900" y="80" width="130" height="50" rx="8"/>
          <text class="h" x="965" y="101" text-anchor="middle">detonate</text><text class="s" x="965" y="118" text-anchor="middle">request to simulator</text>
          <rect class="bx" x="700" y="190" width="150" height="50" rx="8"/>
          <text class="h" x="775" y="211" text-anchor="middle">Hold</text><text class="s" x="775" y="228" text-anchor="middle">no_detection, drone freed</text>

          <line class="ln" x1="170" y1="112" x2="228" y2="112" marker-end="url(#f11a)"/>
          <text class="lbl" x="199" y="92" text-anchor="middle">threat near</text><text class="lbl" x="199" y="104" text-anchor="middle">or arming</text>
          <line class="ln" x1="380" y1="112" x2="438" y2="112" marker-end="url(#f11a)"/>
          <text class="lbl" x="409" y="92" text-anchor="middle">t ≥</text><text class="lbl" x="409" y="104" text-anchor="middle">t_engage − 2</text>
          <line class="ln ln-h" x1="590" y1="112" x2="698" y2="112" marker-end="url(#f11h)"/>
          <text class="lbl lbl-h" x="645" y="86" text-anchor="middle">new track in gate,</text><text class="lbl lbl-h" x="645" y="99" text-anchor="middle">≤ 8 m and receding</text>
          <text class="lbl lbl-h" x="645" y="128" text-anchor="middle">or a mate's blast</text>
          <line class="ln ln-h" x1="850" y1="105" x2="898" y2="105" marker-end="url(#f11h)"/>
          <text class="lbl" x="874" y="97" text-anchor="middle">once</text>
          <polyline class="ln" points="515,130 515,215 698,215" marker-end="url(#f11a)"/>
          <text class="lbl" x="606" y="208" text-anchor="middle">window closes, no hit</text>
          <text class="m" x="775" y="260" text-anchor="middle">FUZE_FALLBACK=timed fires here instead</text>
        </svg>
