<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" class="dg" viewBox="0 0 1040 640" role="img" aria-label="Deployment diagram: the Gazebo simulator, the metrics node and every drone and ship meet on the onboard bus through one Zenoh router; drones and the ship talk to each other over a separate peer-to-peer radio network; the operator reaches the ship over HTTP.">
<style>
:root{--surface:#FFFFFF;--group:#E6ECEF;--ink:#14212B;--ink-2:#3B4B58;--muted:#5D6D79;--line:#C6D0D6;
--accent:#0A6A8A;--accent-soft:rgba(10,106,138,0.09);--hot:#B3431B;--hot-soft:rgba(179,67,27,0.10);--f-sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--surface:#15202A;--group:#18242E;--ink:#E2E9EE;--ink-2:#A7B6C1;--muted:#8696A2;--line:#2C3B47;
--accent:#52B5D5;--accent-soft:rgba(82,181,213,0.13);--hot:#EE8A5E;--hot-soft:rgba(238,138,94,0.14);}}
svg.dg{font-family:var(--f-sans)}
.dg .bg{fill:var(--surface)}

.dg text { fill: var(--ink); font-size: 12px; }
.dg .h { font-weight: 600; font-size: 12.5px; }
.dg .s { fill: var(--muted); font-size: 10.5px; }
.dg .m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dg .mi { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); }
.dg .lbl { font-size: 10.5px; fill: var(--ink-2); }
.dg .lbl-r { fill: var(--accent); }
.dg .lbl-h { fill: var(--hot); }
.dg .band-t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.05em; fill: var(--muted); }
.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dg .bx { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .bx-r { stroke: var(--accent); stroke-width: 1.5; }
.dg .bx-h { stroke: var(--hot); stroke-width: 1.5; }
.dg .bx-fill-r { fill: var(--accent-soft); }
.dg .bx-fill-h { fill: var(--hot-soft); }
.dg .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ctr { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .band-r { fill: var(--accent-soft); stroke: none; }
.dg .note { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ln { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.dg .ln-thin { stroke-width: 1; opacity: 0.75; }
.dg .ln-r { stroke: var(--accent); stroke-dasharray: 6 4; }
.dg .ln-rs { stroke: var(--accent); }
.dg .ln-h { stroke: var(--hot); }
.dg .ln-d { stroke-dasharray: 2 3; }
.dg .ln-dash { stroke-dasharray: 5 4; }
.dg .ln-bold { stroke-width: 2.2; }
.dg .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .mk { fill: var(--ink-2); }
.dg .mk-r { fill: var(--accent); }
.dg .mk-h { fill: var(--hot); }
.dg .dot-r { fill: var(--accent); }
.dg .dot-h { fill: var(--hot); }
.dg .dot-i { fill: var(--ink); }
.dg .zone { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .ring { fill: none; stroke: var(--accent-soft); }
.dg .faint { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.dg .hull { fill: var(--ink-2); }

</style>
<rect class="bg" x="0" y="0" width="1040" height="640" rx="8"/>
        <defs>
          <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
          <marker id="f1r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-r" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <!-- sim_net band -->
        <rect class="grp" x="10" y="10" width="1020" height="180" rx="10"/>
        <text class="band-t" x="24" y="30">SIM_NET · ONBOARD BUS THROUGH ONE ZENOH ROUTER · STANDS IN FOR WIRING, SENSORS AND PHYSICS</text>

        <rect class="bx" x="30" y="44" width="260" height="132" rx="6"/>
        <text class="h" x="44" y="66">gazebo_simulator</text>
        <text class="s" x="44" y="86">Gazebo 11 server · ocean.world</text>
        <text class="m" x="44" y="104">GazeboSimulator.cpp (C++17)</text>
        <text class="s" x="44" y="122">kinematics · wind and gusts</text>
        <text class="s" x="44" y="140">UWB · radar · IMU · GNSS models</text>
        <text class="s" x="44" y="158">blasts · friendly fire · sim/truth</text>

        <rect class="bx" x="450" y="84" width="160" height="68" rx="6"/>
        <text class="h" x="530" y="108" text-anchor="middle">sim_bus</text>
        <text class="s" x="530" y="126" text-anchor="middle">Zenoh router</text>
        <text class="m" x="530" y="142" text-anchor="middle">tcp/7447</text>

        <line class="ln" x1="290" y1="104" x2="448" y2="104" marker-end="url(#f1a)"/>
        <text class="lbl" x="369" y="96" text-anchor="middle">sensors · radar · uwb · gnss</text>
        <line class="ln" x1="450" y1="136" x2="292" y2="136" marker-end="url(#f1a)"/>
        <text class="lbl" x="369" y="152" text-anchor="middle">cmd_vel · detonate · uwb_tx</text>

        <rect class="bx" x="700" y="44" width="310" height="118" rx="6"/>
        <text class="h" x="714" y="66">metrics_node</text>
        <text class="m" x="714" y="86">src/metrics/main.py</text>
        <text class="s" x="714" y="104">estimate vs sim/truth → error, NEES</text>
        <text class="s" x="714" y="122">spatial-hash separation check</text>
        <text class="s" x="714" y="140">distance flown · collisions</text>
        <line class="ln" x1="610" y1="118" x2="698" y2="118" marker-end="url(#f1a)"/>
        <text class="lbl" x="654" y="110" text-anchor="middle">truth · loc</text>

        <!-- operator -->
        <rect class="bx" x="840" y="204" width="170" height="48" rx="6"/>
        <text class="h" x="854" y="224">operator · browser</text>
        <text class="m" x="854" y="242">dashboard :8080</text>
        <polyline class="ln ln-d" points="840,228 790,228 790,300" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
        <text class="lbl" x="782" y="262" text-anchor="end">HTTP · SSE</text>

        <!-- onboard links -->
        <polyline class="ln" points="500,152 500,226 165,226 165,300" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
        <text class="lbl" x="330" y="219" text-anchor="middle">onboard link (one per drone)</text>
        <polyline class="ln" points="560,152 560,226 660,226 660,300" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
        <text class="lbl" x="610" y="219" text-anchor="middle">onboard link</text>

        <!-- drone container -->
        <rect class="ctr" x="30" y="270" width="440" height="170" rx="8"/>
        <text class="h" x="44" y="290">agent × N <tspan class="s" dx="4">one container per drone</tspan></text>
        <rect class="bx" x="45" y="302" width="240" height="124" rx="6"/>
        <text class="h" x="58" y="322">main process · agent.py</text>
        <text class="s" x="58" y="342">EKF · coop / RDL · GNSS check</text>
        <text class="s" x="58" y="360">radar obstacles · APF / ORCA</text>
        <text class="s" x="58" y="378">50 Hz reflex loop · fuze</text>
        <text class="s" x="58" y="396">auction · routes · clock sync</text>
        <text class="s" x="58" y="414">heartbeat 2 Hz · telemetry 1 Hz</text>
        <rect class="bx bx-r" x="310" y="302" width="145" height="124" rx="6"/>
        <text class="h" x="322" y="322">radio process</text>
        <text class="m" x="322" y="342">radio_process.py</text>
        <text class="s" x="322" y="360">Zenoh peer session</text>
        <text class="s" x="322" y="378">watchdog ping 1 s</text>
        <text class="s" x="322" y="396">restart after 5 s</text>
        <line class="ln" x1="287" y1="364" x2="308" y2="364" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
        <text class="lbl" x="297" y="355" text-anchor="middle" style="font-size:9.5px">IPC</text>

        <!-- ship container -->
        <rect class="ctr" x="570" y="270" width="440" height="170" rx="8"/>
        <text class="h" x="584" y="290">ship</text>
        <rect class="bx" x="585" y="302" width="240" height="124" rx="6"/>
        <text class="h" x="598" y="322">ship.py · C2</text>
        <text class="s" x="598" y="342">radar sim · TCPA min-heap</text>
        <text class="s" x="598" y="360">feasibility · approval</text>
        <text class="s" x="598" y="378">intercepts · confirmation</text>
        <text class="s" x="598" y="396">kill assessment · event log</text>
        <text class="s" x="598" y="414">HTTP + SSE dashboard API</text>
        <rect class="bx bx-r" x="850" y="302" width="145" height="124" rx="6"/>
        <text class="h" x="862" y="322">radio process</text>
        <text class="m" x="862" y="342">fixed peer .2:7450</text>
        <text class="s" x="862" y="360">meeting point for</text>
        <text class="s" x="862" y="378">joining drones</text>
        <text class="s" x="862" y="396">same watchdog</text>
        <line class="ln" x1="827" y1="364" x2="848" y2="364" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
        <text class="lbl" x="837" y="355" text-anchor="middle" style="font-size:9.5px">IPC</text>

        <!-- radio band -->
        <rect class="band-r" x="10" y="458" width="1020" height="172" rx="10"/>
        <text class="band-t" x="24" y="478">RADIO_NET · PEER-TO-PEER ZENOH 1.10.1, NO ROUTER · CONTROL OVER QUIC (RETRANSMITTED) · DATA OVER UDP (BEST-EFFORT)</text>
        <polyline class="ln ln-r" points="420,428 420,510 900,510 900,430" marker-end="url(#f1r)"/>
        <text class="lbl lbl-r" x="660" y="502" text-anchor="middle">heartbeat 2 Hz · telemetry 1 Hz · bids · awards ×3</text>
        <polyline class="ln ln-r" points="940,428 940,540 440,540 440,430" marker-end="url(#f1r)"/>
        <text class="lbl lbl-r" x="690" y="557" text-anchor="middle">orders ×3 · roster 1 Hz · ACK + job updates 2 Hz · zones 1 Hz</text>
        <rect class="bx bx-r" x="40" y="572" width="260" height="44" rx="6"/>
        <text class="h" x="54" y="590">other drones</text>
        <text class="s" x="54" y="607">identical containers, one radio each</text>
        <polyline class="ln ln-r" points="340,428 340,594 302,594" marker-start="url(#f1r)" marker-end="url(#f1r)"/>
        <text class="lbl lbl-r" x="352" y="598">bids · awards · help relay · clock beacons</text>
      </svg>
