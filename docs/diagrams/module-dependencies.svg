<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="552" class="dg" viewBox="0 0 1040 552" role="img" aria-label="Import graph: agent.py imports eleven drone modules and eight shared modules; ship.py imports seven shared modules plus threat_queue; the simulator and metrics node have no project imports and connect only through Zenoh topics.">
<style>
:root{--surface:#FFFFFF;--group:#E6ECEF;--ink:#14212B;--ink-2:#3B4B58;--muted:#5D6D79;--line:#C6D0D6;
--accent:#0A6A8A;--accent-soft:rgba(10,106,138,0.09);--hot:#B3431B;--hot-soft:rgba(179,67,27,0.10);--f-sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--surface:#15202A;--group:#18242E;--ink:#E2E9EE;--ink-2:#A7B6C1;--muted:#8696A2;--line:#2C3B47;
--accent:#52B5D5;--accent-soft:rgba(82,181,213,0.13);--hot:#EE8A5E;--hot-soft:rgba(238,138,94,0.14);}}
svg.dg{font-family:var(--f-sans)}
.dg .bg{fill:var(--surface)}

.dg text { fill: var(--ink); font-size: 12px; }
.dg .h { font-weight: 600; font-size: 12.5px; }
.dg .s { fill: var(--muted); font-size: 10.5px; }
.dg .m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dg .mi { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); }
.dg .lbl { font-size: 10.5px; fill: var(--ink-2); }
.dg .lbl-r { fill: var(--accent); }
.dg .lbl-h { fill: var(--hot); }
.dg .band-t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.05em; fill: var(--muted); }
.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dg .bx { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .bx-r { stroke: var(--accent); stroke-width: 1.5; }
.dg .bx-h { stroke: var(--hot); stroke-width: 1.5; }
.dg .bx-fill-r { fill: var(--accent-soft); }
.dg .bx-fill-h { fill: var(--hot-soft); }
.dg .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ctr { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .band-r { fill: var(--accent-soft); stroke: none; }
.dg .note { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ln { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.dg .ln-thin { stroke-width: 1; opacity: 0.75; }
.dg .ln-r { stroke: var(--accent); stroke-dasharray: 6 4; }
.dg .ln-rs { stroke: var(--accent); }
.dg .ln-h { stroke: var(--hot); }
.dg .ln-d { stroke-dasharray: 2 3; }
.dg .ln-dash { stroke-dasharray: 5 4; }
.dg .ln-bold { stroke-width: 2.2; }
.dg .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .mk { fill: var(--ink-2); }
.dg .mk-r { fill: var(--accent); }
.dg .mk-h { fill: var(--hot); }
.dg .dot-r { fill: var(--accent); }
.dg .dot-h { fill: var(--hot); }
.dg .dot-i { fill: var(--ink); }
.dg .zone { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .ring { fill: none; stroke: var(--accent-soft); }
.dg .faint { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.dg .hull { fill: var(--ink-2); }

</style>
<rect class="bg" x="0" y="0" width="1040" height="552" rx="8"/>
        <defs>
          <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
        </defs>
        <!-- agent group -->
        <rect class="grp" x="10" y="34" width="200" height="430" rx="8"/>
        <text class="band-t" x="20" y="54">SRC/AGENT</text>
        <g>
          <rect class="bx" x="20" y="64" width="180" height="28" rx="4"/><text class="mi" x="30" y="82">localization.py</text>
          <rect class="bx" x="20" y="100" width="180" height="28" rx="4"/><text class="mi" x="30" y="118">gnss.py</text><text class="m" x="192" y="118" text-anchor="end">→ localization</text>
          <rect class="bx" x="20" y="136" width="180" height="28" rx="4"/><text class="mi" x="30" y="154">coop.py</text>
          <rect class="bx" x="20" y="172" width="180" height="28" rx="4"/><text class="mi" x="30" y="190">rdl.py</text>
          <rect class="bx" x="20" y="208" width="180" height="28" rx="4"/><text class="mi" x="30" y="226">radar_obstacles.py</text>
          <rect class="bx" x="20" y="244" width="180" height="28" rx="4"/><text class="mi" x="30" y="262">voxel_map.py</text><text class="m" x="192" y="262" text-anchor="end">legacy</text>
          <rect class="bx" x="20" y="280" width="180" height="28" rx="4"/><text class="mi" x="30" y="298">path_planning.py</text>
          <rect class="bx" x="20" y="316" width="180" height="28" rx="4"/><text class="mi" x="30" y="334">fuze.py</text>
          <rect class="bx" x="20" y="352" width="180" height="28" rx="4"/><text class="mi" x="30" y="370">auction.py</text><text class="m" x="192" y="370" text-anchor="end">→ threats</text>
          <rect class="bx" x="20" y="388" width="180" height="28" rx="4"/><text class="mi" x="30" y="406">timing.py</text>
          <rect class="bx" x="20" y="424" width="180" height="28" rx="4"/><text class="mi" x="30" y="442">telemetry.py</text><text class="m" x="192" y="442" text-anchor="end">→ simclock</text>
        </g>
        <!-- hubs -->
        <rect class="bx" x="250" y="176" width="120" height="30" rx="4"/><text class="mi" x="310" y="195" text-anchor="middle">main.py</text>
        <line class="ln" x1="310" y1="206" x2="310" y2="238" marker-end="url(#f3a)"/>
        <rect class="bx bx-r" x="250" y="240" width="120" height="46" rx="4"/>
        <text class="mi" x="310" y="260" text-anchor="middle" style="font-weight:500">agent.py</text>
        <text class="s" x="310" y="276" text-anchor="middle">DenddronAgent</text>
        <!-- agent -> agent modules -->
        <g class="ln ln-thin">
          <line x1="250" y1="244" x2="202" y2="78" marker-end="url(#f3a)"/>
          <line x1="250" y1="248" x2="202" y2="114" marker-end="url(#f3a)"/>
          <line x1="250" y1="251" x2="202" y2="150" marker-end="url(#f3a)"/>
          <line x1="250" y1="255" x2="202" y2="186" marker-end="url(#f3a)"/>
          <line x1="250" y1="258" x2="202" y2="222" marker-end="url(#f3a)"/>
          <line x1="250" y1="262" x2="202" y2="258" marker-end="url(#f3a)"/>
          <line x1="250" y1="266" x2="202" y2="294" marker-end="url(#f3a)"/>
          <line x1="250" y1="270" x2="202" y2="330" marker-end="url(#f3a)"/>
          <line x1="250" y1="273" x2="202" y2="366" marker-end="url(#f3a)"/>
          <line x1="250" y1="277" x2="202" y2="402" marker-end="url(#f3a)"/>
          <line x1="250" y1="281" x2="202" y2="438" marker-end="url(#f3a)"/>
        </g>
        <!-- common group -->
        <rect class="grp" x="450" y="34" width="200" height="430" rx="8"/>
        <text class="band-t" x="460" y="54">SRC/COMMON · SHARED</text>
        <g>
          <rect class="bx" x="460" y="64" width="180" height="30" rx="4"/><text class="mi" x="470" y="83">threats.py</text>
          <rect class="bx" x="460" y="108" width="180" height="30" rx="4"/><text class="mi" x="470" y="127">deconflict.py</text><text class="m" x="632" y="127" text-anchor="end">→ threats</text>
          <rect class="bx" x="460" y="152" width="180" height="30" rx="4"/><text class="mi" x="470" y="171">jobs.py</text>
          <rect class="bx" x="460" y="196" width="180" height="30" rx="4"/><text class="mi" x="470" y="215">links.py</text>
          <rect class="bx" x="460" y="240" width="180" height="30" rx="4"/><text class="mi" x="470" y="259">radio_process.py</text><text class="m" x="632" y="259" text-anchor="end">→ links</text>
          <rect class="bx" x="460" y="284" width="180" height="30" rx="4"/><text class="mi" x="470" y="303">simclock.py</text>
          <rect class="bx" x="460" y="328" width="180" height="30" rx="4"/><text class="mi" x="470" y="347">localclock.py</text>
          <rect class="bx" x="460" y="372" width="180" height="30" rx="4"/><text class="mi" x="470" y="391">timesync.py</text>
          <rect class="bx" x="460" y="416" width="180" height="30" rx="4"/><text class="mi" x="470" y="435">hardware.py</text>
        </g>
        <!-- agent -> common: threats deconflict links radio_process simclock localclock timesync hardware -->
        <g class="ln ln-thin">
          <line x1="370" y1="246" x2="458" y2="79" marker-end="url(#f3a)"/>
          <line x1="370" y1="250" x2="458" y2="123" marker-end="url(#f3a)"/>
          <line x1="370" y1="255" x2="458" y2="211" marker-end="url(#f3a)"/>
          <line x1="370" y1="260" x2="458" y2="255" marker-end="url(#f3a)"/>
          <line x1="370" y1="265" x2="458" y2="299" marker-end="url(#f3a)"/>
          <line x1="370" y1="270" x2="458" y2="343" marker-end="url(#f3a)"/>
          <line x1="370" y1="275" x2="458" y2="387" marker-end="url(#f3a)"/>
          <line x1="370" y1="280" x2="458" y2="431" marker-end="url(#f3a)"/>
        </g>
        <!-- ship hub -->
        <rect class="bx bx-r" x="730" y="240" width="120" height="46" rx="4"/>
        <text class="mi" x="790" y="260" text-anchor="middle" style="font-weight:500">ship.py</text>
        <text class="s" x="790" y="276" text-anchor="middle">Ship, HTTP handler</text>
        <!-- ship -> common: threats deconflict jobs links radio_process simclock localclock -->
        <g class="ln ln-thin">
          <line x1="730" y1="246" x2="642" y2="79" marker-end="url(#f3a)"/>
          <line x1="730" y1="250" x2="642" y2="123" marker-end="url(#f3a)"/>
          <line x1="730" y1="255" x2="642" y2="167" marker-end="url(#f3a)"/>
          <line x1="730" y1="260" x2="642" y2="211" marker-end="url(#f3a)"/>
          <line x1="730" y1="265" x2="642" y2="255" marker-end="url(#f3a)"/>
          <line x1="730" y1="270" x2="642" y2="299" marker-end="url(#f3a)"/>
          <line x1="730" y1="275" x2="642" y2="343" marker-end="url(#f3a)"/>
        </g>
        <!-- ship group -->
        <rect class="grp" x="880" y="34" width="150" height="430" rx="8"/>
        <text class="band-t" x="890" y="54">SRC/SHIP</text>
        <rect class="bx" x="890" y="200" width="130" height="30" rx="4"/><text class="mi" x="900" y="219">threat_queue.py</text>
        <rect class="bx" x="890" y="300" width="130" height="30" rx="4"/><text class="mi" x="900" y="319">dashboard.html</text>
        <line class="ln" x1="850" y1="252" x2="888" y2="222" marker-end="url(#f3a)"/>
        <line class="ln ln-d" x1="850" y1="276" x2="888" y2="308" marker-end="url(#f3a)"/>
        <text class="lbl" x="955" y="346" text-anchor="middle">served over HTTP</text>

        <!-- bottom strip -->
        <rect class="grp" x="10" y="482" width="1020" height="58" rx="8"/>
        <text class="h" x="24" y="504">Linked only through Zenoh topics, no imports</text>
        <text class="s" x="24" y="524">sim/GazeboSimulator.cpp (C++) · src/metrics/main.py · tools/comms/* and experiments/* drive the swarm from outside</text>
