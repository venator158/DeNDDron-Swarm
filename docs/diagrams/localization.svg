<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" class="dg" viewBox="0 0 1040 360" role="img" aria-label="Localization loop: IMU delta-velocity drives the EKF prediction; anchor ranges pass a gate and Huber weighting before a Kalman update; peer ranges are used only along fresher anchor chains with the peer's uncertainty added; GNSS is a comparator while anchors are fresh and a fallback otherwise; all corrections write back into the shared state.">
<style>
:root{--surface:#FFFFFF;--group:#E6ECEF;--ink:#14212B;--ink-2:#3B4B58;--muted:#5D6D79;--line:#C6D0D6;
--accent:#0A6A8A;--accent-soft:rgba(10,106,138,0.09);--hot:#B3431B;--hot-soft:rgba(179,67,27,0.10);--f-sans:"IBM Plex Sans","Helvetica Neue",Helvetica,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
@media (prefers-color-scheme: dark){:root{--surface:#15202A;--group:#18242E;--ink:#E2E9EE;--ink-2:#A7B6C1;--muted:#8696A2;--line:#2C3B47;
--accent:#52B5D5;--accent-soft:rgba(82,181,213,0.13);--hot:#EE8A5E;--hot-soft:rgba(238,138,94,0.14);}}
svg.dg{font-family:var(--f-sans)}
.dg .bg{fill:var(--surface)}

.dg text { fill: var(--ink); font-size: 12px; }
.dg .h { font-weight: 600; font-size: 12.5px; }
.dg .s { fill: var(--muted); font-size: 10.5px; }
.dg .m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.dg .mi { font-family: var(--f-mono); font-size: 11px; fill: var(--ink); }
.dg .lbl { font-size: 10.5px; fill: var(--ink-2); }
.dg .lbl-r { fill: var(--accent); }
.dg .lbl-h { fill: var(--hot); }
.dg .band-t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.05em; fill: var(--muted); }
.dg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dg .bx { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .bx-r { stroke: var(--accent); stroke-width: 1.5; }
.dg .bx-h { stroke: var(--hot); stroke-width: 1.5; }
.dg .bx-fill-r { fill: var(--accent-soft); }
.dg .bx-fill-h { fill: var(--hot-soft); }
.dg .grp { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ctr { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .band-r { fill: var(--accent-soft); stroke: none; }
.dg .note { fill: var(--group); stroke: var(--line); stroke-width: 1; }
.dg .ln { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
.dg .ln-thin { stroke-width: 1; opacity: 0.75; }
.dg .ln-r { stroke: var(--accent); stroke-dasharray: 6 4; }
.dg .ln-rs { stroke: var(--accent); }
.dg .ln-h { stroke: var(--hot); }
.dg .ln-d { stroke-dasharray: 2 3; }
.dg .ln-dash { stroke-dasharray: 5 4; }
.dg .ln-bold { stroke-width: 2.2; }
.dg .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .mk { fill: var(--ink-2); }
.dg .mk-r { fill: var(--accent); }
.dg .mk-h { fill: var(--hot); }
.dg .dot-r { fill: var(--accent); }
.dg .dot-h { fill: var(--hot); }
.dg .dot-i { fill: var(--ink); }
.dg .zone { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 1.3; stroke-dasharray: 5 4; }
.dg .ring { fill: none; stroke: var(--accent-soft); }
.dg .faint { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
.dg .hull { fill: var(--ink-2); }

</style>
<rect class="bg" x="0" y="0" width="1040" height="360" rx="8"/>
          <defs>
            <marker id="f8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
          <rect class="bx" x="20" y="166" width="130" height="60" rx="6"/>
          <text class="h" x="32" y="190">IMU Δv</text><text class="s" x="32" y="210">each 50 Hz frame</text>
          <line class="ln" x1="150" y1="196" x2="178" y2="196" marker-end="url(#f8a)"/>
          <rect class="bx" x="180" y="152" width="170" height="88" rx="6"/>
          <text class="h" x="192" y="174">Predict</text>
          <text class="mi" x="192" y="194">x ← F x + u</text>
          <text class="mi" x="192" y="212">P ← F P Fᵀ + Q</text>
          <text class="s" x="192" y="230">bias: Gauss–Markov</text>
          <line class="ln" x1="350" y1="196" x2="378" y2="196" marker-end="url(#f8a)"/>
          <rect class="bx bx-r bx-fill-r" x="380" y="50" width="90" height="300" rx="6"/>
          <text class="h" x="425" y="186" text-anchor="middle">x, P</text>
          <text class="s" x="425" y="204" text-anchor="middle">6 states</text>
          <text class="m" x="425" y="224" text-anchor="middle">x y vx vy</text>
          <text class="m" x="425" y="240" text-anchor="middle">bx by</text>

          <text class="band-t" x="495" y="46">ANCHORS</text>
          <rect class="bx" x="495" y="52" width="130" height="74" rx="6"/>
          <text class="h" x="507" y="72">anchor range</text><text class="s" x="507" y="89">4 on the hull, 2 Hz</text><text class="s" x="507" y="104">h = ‖p − aₖ‖,</text><text class="s" x="507" y="118">altitude known</text>
          <rect class="bx" x="645" y="52" width="170" height="74" rx="6"/>
          <text class="h" x="657" y="72">gate · Huber</text><text class="s" x="657" y="89">drop: too long &gt; 3.29σ</text><text class="s" x="657" y="104">drop: too short &gt; 8σ</text><text class="s" x="657" y="118">&gt; 2.5σ: down-weight</text>
          <rect class="bx" x="835" y="52" width="165" height="74" rx="6"/>
          <text class="h" x="847" y="72">Kalman update</text><text class="mi" x="847" y="89">K = P Hᵀ / S</text><text class="s" x="847" y="104">Joseph-form P</text><text class="s" x="847" y="118">5 drops → re-lock</text>

          <text class="band-t" x="495" y="157">PEERS (COOP)</text>
          <rect class="bx" x="495" y="163" width="130" height="74" rx="6"/>
          <text class="h" x="507" y="183">peer range</text><text class="s" x="507" y="200">peer's state rides</text><text class="s" x="507" y="215">in its UWB frame</text>
          <rect class="bx" x="645" y="163" width="170" height="74" rx="6"/>
          <text class="h" x="657" y="183">use it only if</text><text class="s" x="657" y="200">I see no anchors, and</text><text class="s" x="657" y="215">the peer's anchor fix</text><text class="s" x="657" y="229">is newer than mine</text>
          <rect class="bx" x="835" y="163" width="165" height="74" rx="6"/>
          <text class="h" x="847" y="183">peer update</text><text class="mi" x="847" y="200">σ² + uᵀ Pⱼ u</text><text class="s" x="847" y="215">then floor variance</text><text class="s" x="847" y="229">along line of sight</text>

          <text class="band-t" x="495" y="268">GNSS</text>
          <rect class="bx" x="495" y="274" width="130" height="74" rx="6"/>
          <text class="h" x="507" y="294">GNSS fix</text><text class="s" x="507" y="311">5 Hz, relative to</text><text class="s" x="507" y="326">the ship's fix,</text><text class="s" x="507" y="340">rotated by heading</text>
          <rect class="bx" x="645" y="274" width="170" height="74" rx="6"/>
          <text class="h" x="657" y="294">own anchors fresh?</text><text class="s" x="657" y="311">yes: NIS comparator</text><text class="s" x="657" y="326">fails → spoof latch,</text><text class="s" x="657" y="340">GNSS ignored for good</text>
          <rect class="bx" x="835" y="274" width="165" height="74" rx="6"/>
          <text class="h" x="847" y="294">no: fallback</text><text class="s" x="847" y="311">fuse 1 Hz, 2× noise</text><text class="s" x="847" y="326">variance floor</text><text class="s" x="847" y="340">IMU-shadow spoof check</text>

          <g class="ln">
            <line x1="470" y1="89" x2="493" y2="89" marker-end="url(#f8a)"/>
            <line x1="625" y1="89" x2="643" y2="89" marker-end="url(#f8a)"/>
            <line x1="815" y1="89" x2="833" y2="89" marker-end="url(#f8a)"/>
            <line x1="470" y1="200" x2="493" y2="200" marker-end="url(#f8a)"/>
            <line x1="625" y1="200" x2="643" y2="200" marker-end="url(#f8a)"/>
            <line x1="815" y1="200" x2="833" y2="200" marker-end="url(#f8a)"/>
            <line x1="470" y1="311" x2="493" y2="311" marker-end="url(#f8a)"/>
            <line x1="625" y1="311" x2="643" y2="311" marker-end="url(#f8a)"/>
            <line x1="815" y1="311" x2="833" y2="311" marker-end="url(#f8a)"/>
          </g>
          <polyline class="ln ln-rs" points="1000,89 1018,89"/>
          <polyline class="ln ln-rs" points="1000,200 1018,200"/>
          <polyline class="ln ln-rs" points="1000,311 1018,311 1018,26 425,26 425,48" marker-end="url(#f8a)"/>
          <text class="lbl lbl-r" x="720" y="19" text-anchor="middle">every correction writes back into x, P</text>
        </svg>
